<!DOCTYPE html>
<!--
  index.html — Cartelera pública de eventos.
  Cualquier persona puede verla sin iniciar sesión.
  Contiene: barra superior con botón "Ingresar", encabezado con el escudo,
  barra de filtros (fecha y precio), contenedor de tarjetas (#eventsContainer)
  y el modal de login. Toda la lógica está en app.js; los estilos en styles.css.
  Usa Bootstrap 5 y Bootstrap Icons desde CDN.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos en El Carmen de Viboral</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2 text-primary" href="index.html">
        <span class="navbar-plato-wrapper">
          <img src="img/plato.png" alt="Cerámica El Carmen" class="navbar-plato">
        </span>
        <span>Cultura El Carmen</span>
      </a>
      <button class="btn btn-login" data-bs-toggle="modal" data-bs-target="#loginModal">
        <i class="bi bi-person-lock me-1"></i> Ingresar
      </button>
    </div>
  </nav>

  <header class="hero-section">
    <div class="container">
      <div class="carmen-logo" title="Escudo de El Carmen de Viboral - Dios, Patria y Trabajo">
        <img src="img/carmenLogo.png" alt="Escudo de El Carmen de Viboral">
      </div>
      <h1 class="hero-title mb-2">Eventos en El Carmen de Viboral</h1>
      <p class="text-muted mb-0">Agenda cultural y cultura :D</p>
    </div>
  </header>

  <main class="container mb-5">
    <div class="filter-card mb-4">
      <div class="row g-3 align-items-center justify-content-between">
        <div class="col-md-7">
          <span class="text-muted small fw-bold d-block mb-2">
            <i class="bi bi-calendar3 me-1"></i> ORGANIZAR POR FECHA:
          </span>
          <div class="d-flex flex-wrap gap-2" role="group">
            <button type="button" class="btn btn-primary filter-btn active" onclick="setTimeFilter('ALL', this)">Todos</button>
            <button type="button" class="btn btn-outline-primary filter-btn" onclick="setTimeFilter('DAY', this)">Día (Hoy)</button>
            <button type="button" class="btn btn-outline-primary filter-btn" onclick="setTimeFilter('WEEK', this)">Esta Semana</button>
            <button type="button" class="btn btn-outline-primary filter-btn" onclick="setTimeFilter('MONTH', this)">Este Mes</button>
          </div>
        </div>

        <div class="col-md-5 text-md-end">
          <span class="text-muted small fw-bold d-block mb-2">
            <i class="bi bi-ticket-perforated me-1"></i> ENTRADA:
          </span>
          <div class="d-flex flex-wrap gap-2 justify-content-md-end" role="group">
            <button type="button" class="btn btn-dark filter-btn active" onclick="setPriceFilter('ALL', this)">Todos</button>
            <button type="button" class="btn btn-outline-success filter-btn" onclick="setPriceFilter('FREE', this)">Gratis</button>
            <button type="button" class="btn btn-outline-warning filter-btn" onclick="setPriceFilter('PAID', this)">No Gratis</button>
          </div>
        </div>
      </div>
    </div>

    <div id="eventsContainer" class="row g-4"></div>
  </main>

  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold"><i class="bi bi-shield-lock text-primary me-2"></i>Acceso de Gestión</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body p-4">
          <p class="text-muted small mb-3">Ingresa con tu cuenta de <strong>Administrador</strong> u <italy>Organizador</italy> para gestionar eventos.</p>
          <div id="loginError" class="alert alert-danger d-none py-2 small"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Correo electrónico</label>
              <input type="email" id="loginEmail" class="form-control rounded-3" placeholder="admin@carmen.gov.co" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Contraseña</label>
              <input type="password" id="loginPassword" class="form-control rounded-3" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login w-100 py-2 mt-2">Entrar al Panel</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
